services:
  - type: web
    name: cicadarise
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn cicada_rise.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cicadarise-db
          property: connectionString

databases:
  - name: cicadarise-db
    databaseName: cicada_rise_db
    user: cicada_user